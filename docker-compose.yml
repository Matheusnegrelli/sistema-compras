services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: compras
      POSTGRES_PASSWORD: compras
      POSTGRES_DB: compras
    ports:
      - "5432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compras"]
      interval: 3s
      retries: 20

  api-estoque:
    build: ./api-estoque
    environment:
      API_KEY: chave-demo
    ports:
      - "4000:4000"

  web:
    build: ./web
    depends_on:
      banco:
        condition: service_healthy
      api-estoque:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://compras:compras@banco:5432/compras?schema=public
      ESTOQUE_API_URL: http://api-estoque:4000
      ESTOQUE_API_KEY: chave-demo
      AUTH_SECRET: troque-esta-chave-em-producao-0123456789
      SYNC_INTERVALO_MIN: "5"
    ports:
      - "3000:3000"

volumes:
  dados-banco:
